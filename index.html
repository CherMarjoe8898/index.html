<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TLE/TechPro Digital Lesson Bank & Review System</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .badge-pending { background:#fef3c7; color:#92400e; }
  .badge-return  { background:#fee2e2; color:#991b1b; }
  .badge-approved{ background:#dcfce7; color:#166534; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwlgzqmsCaYxunPRmglCddrAzfRhjsbyeiF7ZKR8m66GlGZkb54yXCq4NKV8vGdpkoc3Q/exec';
</script>

<header class="bg-teal-800 text-white px-6 py-4 shadow">
  <h1 class="text-xl font-semibold">TLE/TechPro Digital Lesson Bank &amp; Review System</h1>
</header>

<main class="flex flex-col lg:flex-row gap-4 p-4 max-w-[1600px] mx-auto">

  <!-- LEFT PANEL -->
  <section class="w-full lg:w-[40%] space-y-4">

    <!-- Teacher submission -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-lg font-semibold text-teal-800 mb-3">A. Teacher Submission</h2>
      <form id="submitForm" class="space-y-3">
        <div>
          <label class="block text-sm font-medium">Teacher Name</label>
          <input id="teacherName" required class="w-full border rounded px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium">TLE Component</label>
          <select id="component" required class="w-full border rounded px-3 py-2">
            <option value="">Select...</option>
            <option>Home Economics</option>
            <option>Agri-Fishery Arts</option>
            <option>Industrial Arts</option>
            <option>ICT</option>
            <option>TechPro</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium">Grade / Section</label>
            <input id="section" required class="w-full border rounded px-3 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium">Quarter / Week</label>
            <input id="period" required placeholder="e.g. Q2 W3" class="w-full border rounded px-3 py-2" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium">Lesson Plan (.docx only, max 10 MB)</label>
          <input id="file" type="file" accept=".docx" required
                 class="w-full text-sm file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-teal-700 file:text-white hover:file:bg-teal-800" />
        </div>
        <div>
          <label class="block text-sm font-medium">Submission Key</label>
          <input id="teacherKey" type="password" required class="w-full border rounded px-3 py-2" />
        </div>
        <button type="submit" id="submitBtn"
                class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-2 rounded">
          Submit to Drive Bank
        </button>
        <p id="submitMsg" class="text-sm"></p>
      </form>
    </div>

    <!-- Master Teacher panel -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-lg font-semibold text-teal-800 mb-3">B. Master Teacher Panel</h2>

      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-sm font-medium">Reviewer Key</label>
          <input id="reviewerKey" type="password" class="w-full border rounded px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium">Reviewer Name</label>
          <input id="reviewerName" class="w-full border rounded px-3 py-2" />
        </div>
      </div>

      <button id="loadBtn" class="w-full bg-slate-700 hover:bg-slate-800 text-white py-2 rounded mb-3">
        Load Submissions
      </button>

      <div class="mb-3">
        <label class="block text-sm font-medium mb-1">Submission</label>
        <select id="submissionSelect" class="w-full border rounded px-3 py-2">
          <option value="">— load submissions first —</option>
        </select>
      </div>

      <div id="statusBadgeWrap" class="mb-3 hidden">
        <span id="statusBadge" class="px-3 py-1 rounded-full text-sm font-medium"></span>
      </div>

      <fieldset class="mb-3">
        <legend class="text-sm font-medium mb-1">Review Status</legend>
        <div class="flex flex-wrap gap-4 text-sm">
          <label class="flex items-center gap-1"><input type="radio" name="status" value="Pending Review" /> Pending Review</label>
          <label class="flex items-center gap-1"><input type="radio" name="status" value="Return to Sender" /> Return to Sender</label>
          <label class="flex items-center gap-1"><input type="radio" name="status" value="Approved" /> Approved</label>
        </div>
      </fieldset>

      <div class="mb-3">
        <label class="block text-sm font-medium">Feedback &amp; Major Corrections</label>
        <textarea id="feedback" rows="4" class="w-full border rounded px-3 py-2"></textarea>
      </div>

      <div class="text-xs text-slate-500 mb-3 space-y-1">
        <div>Date/Time Submitted: <span id="tsSubmitted">—</span></div>
        <div>Date/Time Actioned: <span id="tsActioned">—</span></div>
      </div>

      <button id="saveBtn" class="w-full bg-teal-700 hover:bg-teal-800 text-white py-2 rounded">
        Save Review &amp; Log Status
      </button>
      <p id="reviewMsg" class="text-sm mt-2"></p>
    </div>
  </section>

  <!-- RIGHT PANEL -->
  <section class="w-full lg:w-[60%]">
    <div class="bg-white rounded-xl shadow p-5 h-full flex flex-col">
      <h2 class="text-lg font-semibold text-teal-800 mb-3">Live Document Preview &amp; In-Browser Editing</h2>
      <div id="workbench" class="flex-1 min-h-[70vh] rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center bg-slate-50">
        <p id="placeholder" class="text-slate-500 text-center px-6">
          Select or upload a lesson plan to view and edit directly without downloading.
        </p>
        <iframe id="docFrame" class="w-full h-full
